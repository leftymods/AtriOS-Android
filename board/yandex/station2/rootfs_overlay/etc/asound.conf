# /etc/asound.conf - AtriOS ALSA configuration for Yandex Station Max (AML-AUGESOUND)

pcm.!default {
    type asym
    playback.pcm "playback_plug"
    capture.pcm "capture_plug"
}

pcm.playback_plug {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
    }
}

pcm.capture_plug {
    type plug
    slave {
        pcm "hw:0,1"
        format S32_LE
        rate 48000
        channels 8
    }
}

ctl.!default {
    type hw
    card 0
}
