@INCLUDE /data/quasar/fluent-bit/variables.cfg
@INCLUDE /data/quasar/fluent-bit/device.cfg

[SERVICE]
    Flush       ${flushInterval}
    Daemon      Off
    HTTP_Server ${httpServer}
    HTTP_Listen 0.0.0.0
    HTTP_PORT   ${httpServerPort}

[INPUT]
    Name                tail
    Alias               daemons
    Tag                 daemons_${daemonsLogsDst}
    Path                ${logsDir}/*.log
    DB                  ${tailDbFile}
    Path_Key            Path
    Key                 Data
    Buffer_Chunk_Size   ${tailBufferChunkSize}
    Buffer_Max_Size     ${tailBufferMaxSize}
    Skip_Long_Lines     ${tailSkipLongLines}
    mem_buf_limit       ${memBufLimit}
    read_from_head      True

[INPUT]
    Name                kmsg
    Alias               kernel
    Tag                 kernel_${kernelLogsDst}
    mem_buf_limit       ${memBufLimit}

[INPUT]
    Name                tail
    Tag                 logcat_${logcatDst}
    Path                /tmp/logcat.log
    DB                  ${tailDbFile}
    Path_Key            Path
    Key                 Data
    Buffer_Chunk_Size   ${tailBufferChunkSize}
    Buffer_Max_Size     ${tailBufferMaxSize}
    Skip_Long_Lines     ${tailSkipLongLines}
    mem_buf_limit       ${memBufLimit}
    read_from_head      True

[FILTER]
    Name modify
    Match kernel_*
    Add Path dmesg
    Rename msg Data
    Remove priority
    Remove sequence
    Remove sec
    Remove usec

[FILTER]
    Name        record_modifier
    Match       *
    Whitelist_key Data
    Whitelist_key Path
    Record      DeviceId ${device_id}
    Record      Platform ${device_platform}

[OUTPUT]
    Name        stdout
    Match       ${stdoutMatch}
    Format      json
    json_date_format epoch
    json_date_key Timestamp

[OUTPUT]
    Name                        http
    Alias                       clickdaemon
    Match                       *_http
    Host                        ${clickdaemonHost}
    Port                        ${clickdaemonPort}
    URI                         ${clickdaemonUri}
    IPv6                        ${httpIPv6}
    tls                         ${httpTls}
    tls.ca_file                 ${device_crtFile}
    Format                      json
    Compress                    ${httpCompress}
    json_date_format            epoch
    json_date_key               Timestamp
    Retry_Limit                 ${httpRetryLimit}
    net.keepalive_idle_timeout  ${keepAliveTimeout}
    net.keepalive_max_recycle   ${keepAliveMaxRecycle}
    Workers                     ${httpWorkers}

